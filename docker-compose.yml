services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: budgeteer-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: budgeteer-web
    restart: unless-stopped
    volumes:
      - api-public:/usr/share/caddy:ro

  caddy:
    image: caddy:2-alpine
    container_name: budgeteer-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - api-public:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  api-data:
  api-public:
  caddy-data:
  caddy-config:
